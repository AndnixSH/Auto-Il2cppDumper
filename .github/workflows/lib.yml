name: Lib.so Build

permissions:
  contents: write

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build native lib
        run: ./gradlew assembleDebug

      # ---------------------------
      # 1. Создаем тег
      # ---------------------------
      - name: Create tag
        id: create_tag
        run: |
          TAG=v${{ github.run_number }}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          git tag $TAG
          git push origin $TAG

      # ---------------------------
      # 2. Создаём релиз
      # ---------------------------
      - name: Create Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.create_tag.outputs.tag }}
          name: "Auto Build ${{ steps.create_tag.outputs.tag }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------
      # 3. Загружаем .so файл
      # ---------------------------
      - name: Upload .so files to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.create_tag.outputs.tag }}
          overwrite_files: true
          files: app/build/intermediates/merged_native_libs/debug/out/lib/**/lib*.so
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}