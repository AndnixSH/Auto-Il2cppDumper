name: Lib.so Build
permissions:
  contents: write

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build native lib
        run: ./gradlew assembleDebug

      - name: Upload native .so
        uses: actions/upload-artifact@v5
        with:
          name: Lib.so-lib-${{ github.run_id }}
          path: app/build/intermediates/merged_native_libs/debug/out/lib/**/lib*.so